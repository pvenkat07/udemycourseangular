<app-header />
<main>
  <ul id="users">
    <button> Add New User</button>
    @for (user of users; track user.id) {
    <li>
      <app-user [user]="user" [selected]="user.id === selectedUserId" (select)="onSelectUser($event)" />
    </li>
    }
  </ul>
  @if (selectedUserId) {
    <app-tasks [name]="selectedUser.name" [userId]="selectedUser.id"/>
  } @else {
    <p> Select users to see their tasks!</p>
  }
</main>
